[[intent]]
action = "media.seek"
title = "Seek Forward"
icon = "media-seek-forward-symbolic"
args = { direction = "forward" }
patterns = [
  "(seek|skip) forward {seconds:level} [seconds]",
  "forward {seconds:level} [seconds]",
]

[[intent]]
action = "media.seek"
title = "Seek Back"
icon = "media-seek-backward-symbolic"
args = { direction = "back" }
patterns = [
  "(seek|skip) back [by] {seconds:level} [seconds]",
  "back {seconds:level} [seconds]",
]

# ── Modes ─────────────────────────────────────────────────────────────────

[[mode]]
mode = "find"
patterns = [
  "search (files|computer) [for] {rest}",
  "(find|search|locate|look for|look up|where is|where are) [for] {rest}",
]

[[mode]]
mode = "open"
patterns = ["(open|launch|start|run|show|go to|switch to) {rest}"]
