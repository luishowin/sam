  "[set] alarm [for] {time:rest}",
  "alarm at {time:rest}",
  "wake up at {time:rest}",
]

[[intent]]
action = "alarm.cancel"
title = "Cancel Alarm"
icon = "alarm-symbolic"
patterns = [
