  "(turn|switch) (wifi|wi-fi|wireless) off",
  "(disable|deactivate|stop) (wifi|wi-fi|wireless)",
  "(wifi|wi-fi|wireless) (off|disable|disabled)",
]

[[intent]]
action = "wifi.set"
title = "Turn Wi-Fi On"
icon = "network-wireless-symbolic"
keywords = ["wireless"]
args = { state = "on" }
patterns = [
  "(turn|switch) on (wifi|wi-fi|wireless)",
  "(turn|switch) (wifi|wi-fi|wireless) on",
  "(enable|activate|start) (wifi|wi-fi|wireless)",
  "(wifi|wi-fi|wireless) (on|enable|enabled)",
]

