# SAM Core's grammar (ARCHITECTURE.md §6).
#
# Input is normalised before it gets here: lowercased, contractions expanded,
# possessive 's dropped, filler words removed (please, can, you, me, my, the,
# a, an, …), a leading "to" and a trailing "now" dropped. So patterns never
# contain filler words — the compiler rejects them.
#
# Pattern syntax, matched against the whole input:
#   word            that word
#   (a|b c)         one of the alternatives (each may be several words)
#   [a|b c]         optionally one of them
#   {name:rest}     one or more remaining words (last only)
#   {name:place}    a place word      {name:level}   0–100, optionally with %
#   {name:on_off}   on / off / toggle and synonyms
#
# An [[intent]] names an action (ARCHITECTURE.md §7), fixed args, and the
# title and icon its row shows. Its title and keywords are also matched
# fuzzily, so a command appears while it is being typed.
# A [[mode]] rewrites the query instead of naming an action.
# Rules are tried in file order; the first full match wins.

# ── Places ────────────────────────────────────────────────────────────────

[[intent]]
action = "place.open"
title = "Open folder"
icon = "folder-symbolic"
patterns = [
  "{place:place} [folder]",
  "(open|show|browse|go to) {place:place} [folder]",
]

# ── Screen and session ────────────────────────────────────────────────────

[[intent]]
action = "system.lock"
title = "Lock Screen"
icon = "system-lock-screen-symbolic"
keywords = ["lock"]
patterns = [
  "lock",
  "lock up",
  "lock (screen|computer|pc|laptop|session|desktop|machine|it)",
  "(lock screen|screen lock)",
]

[[intent]]
action = "system.suspend"
title = "Suspend"
subtitle = "Asks first"
icon = "media-playback-pause-symbolic"
keywords = ["sleep"]
patterns = [
  "(suspend|sleep|hibernate)",
  "(suspend|sleep) (computer|pc|laptop|machine|system)",
  "(go|put computer) to sleep",
  "(put|send) (computer|pc|laptop|machine) to sleep",
]

[[intent]]
action = "session.logout"
title = "Log Out…"
subtitle = "GNOME asks first"
icon = "system-log-out-symbolic"
keywords = ["sign out", "logout"]
patterns = ["(log out|logout|log off|sign out|signout)"]

[[intent]]
action = "session.restart"
title = "Restart…"
subtitle = "GNOME asks first"
icon = "system-reboot-symbolic"
keywords = ["reboot"]
patterns = [
  "(restart|reboot)",
  "(restart|reboot) (computer|pc|laptop|machine|system)",
]

[[intent]]
action = "session.power_off"
title = "Power Off…"
subtitle = "GNOME asks first"
icon = "system-shutdown-symbolic"
keywords = ["shut down", "shutdown"]
patterns = [
  "(shut down|shutdown|power off|poweroff|switch off)",
  "(shut down|shutdown|power off) (computer|pc|laptop|machine|system)",
  "(turn|switch) off (computer|pc|laptop|machine|system)",
  "(turn|switch) (computer|pc|laptop|machine) off",
]

# ── Radios ────────────────────────────────────────────────────────────────

[[intent]]
action = "bluetooth.set"
title = "Turn Bluetooth Off"
icon = "bluetooth-disabled-symbolic"
args = { state = "off" }
patterns = [
  "(turn|switch) off bluetooth",
  "(turn|switch) bluetooth off",
  "(disable|deactivate|stop) bluetooth",
  "bluetooth (off|disable|disabled)",
  "no bluetooth",
]

[[intent]]
action = "bluetooth.set"
title = "Turn Bluetooth On"
icon = "bluetooth-active-symbolic"
args = { state = "on" }
patterns = [
  "(turn|switch) on bluetooth",
  "(turn|switch) bluetooth on",
  "(enable|activate|start) bluetooth",
  "bluetooth (on|enable|enabled)",
]

[[intent]]
action = "bluetooth.set"
title = "Toggle Bluetooth"
icon = "bluetooth-active-symbolic"
args = { state = "toggle" }
patterns = ["bluetooth", "toggle bluetooth"]

[[intent]]
action = "wifi.set"
