kind = "Command"

[[case]]
query = "list timers"
action = "timer.list"
kind = "Command"

[[case]]
query = "set alarm for 07:30"
action = "alarm.set"
kind = "Command"

[[case]]
query = "cancel alarm"
action = "alarm.cancel"
kind = "Command"

[[case]]
query = "open my downloads"
action = "place.open"
