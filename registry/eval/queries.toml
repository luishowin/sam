# Frozen evaluation corpus for the Fedora prototype.
#
# Add a case only when it is a real capability and the handler is tested.
# Run with: cargo test -p sam-core --test eval

[[case]]
query = "lock my computer"
action = "system.lock"
kind = "Command"

[[case]]
query = "turn off bluetooth"
action = "bluetooth.set"
kind = "Command"

[[case]]
query = "turn on wi-fi"
action = "wifi.set"
kind = "Command"

[[case]]
query = "volume up"
action = "audio.volume"
kind = "Command"

[[case]]
query = "set volume to 35"
action = "audio.volume_set"
kind = "Command"

[[case]]
query = "pause music"
action = "media.control"
kind = "Command"

[[case]]
query = "next track"
action = "media.control"
kind = "Command"

[[case]]
query = "skip forward 30 seconds"
action = "media.seek"
kind = "Command"

[[case]]
query = "dark mode on"
action = "appearance.dark"
kind = "Command"

[[case]]
query = "do not disturb on"
action = "notifications.dnd"
kind = "Command"

[[case]]
query = "brightness up"
action = "display.brightness"
kind = "Command"

[[case]]
query = "dim the screen"
action = "display.brightness"
kind = "Command"

[[case]]
query = "set brightness to 40"
