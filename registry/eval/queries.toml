kind = "Command"

[[case]]
query = "airplane mode on"
action = "system.airplane"
kind = "Command"

[[case]]
query = "power saver mode"
action = "power.profile"
kind = "Command"

[[case]]
query = "open terminal"
action = "terminal.open"
kind = "Command"

[[case]]
query = "set a timer for 10m"
