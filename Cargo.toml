[workspace]
resolver = "3"
members = ["crates/sam-core", "crates/sam-linux", "crates/sam-voice", "crates/sam"]
# Speech needs ALSA headers at build time; the search engine and panel do not.
default-members = ["crates/sam-core", "crates/sam-linux", "crates/sam"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/luishowin/sam"

[workspace.dependencies]
sam-core = { path = "crates/sam-core" }
sam-linux = { path = "crates/sam-linux" }
sam-voice = { path = "crates/sam-voice" }

# sam-core's whole dependency list is held to an allowlist by tests/purity.rs.
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }
nucleo-matcher = "0.3"
# The Fedora adapter's JSON (system snapshots, diagnostics).
serde_json = "1"

# The platform. Built against this machine: GTK 4.24, GLib 2.90.
glib = "0.22"
gio = { version = "0.22", features = ["v2_84"] }
gio-unix = { version = "0.22", features = ["v2_84"] }
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.headless]
inherits = "release"
debug-assertions = true
